[project]
name = "aiflow"
version = "0.1.0"
description = "Personal AI video generation tool — Veo3 + Gemini + TTS pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.3",
    "google-genai>=0.5.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

# Phase 3 dependencies (audio)
audio = [
    "edge-tts>=7.0",
    "faster-whisper>=1.1",
]

# Phase 3.5 dependencies (visual layer)
visual = [
    "playwright>=1.45",
]

# Phase 4.5 dependencies (video remaster)
remaster = [
    "yt-dlp>=2024.12",
    "browser-cookie3>=0.19",
    "gmssl>=3.2",
    "aiofiles>=23.2",
]

[project.scripts]
aiflow = "server.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
