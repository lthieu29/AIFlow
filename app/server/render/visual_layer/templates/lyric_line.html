<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Lyric Line</title>
  <script src="{{__VENDOR_GSAP__}}"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Inter', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    }
    #stage {
      width: 1080px;
      height: 1920px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 80px 72px;
    }
    #line-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }
    #current-line {
      font-size: 80px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1px;
      color: #ffffff;
      text-shadow:
        0 0 40px rgba(255, 255, 255, 0.55),
        0 4px 24px rgba(0, 0, 0, 0.60);
      opacity: 0;
      transform: translateY(32px) scale(0.94);
      max-width: 940px;
      word-break: break-word;
    }
    #highlight-bar {
      width: 0px;
      height: 6px;
      background: linear-gradient(90deg, #FF6F00 0%, #FFB300 100%);
      border-radius: 3px;
      transform-origin: left center;
    }
    #next-line {
      font-size: 52px;
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: -0.5px;
      color: rgba(255, 255, 255, 0.45);
      opacity: 0;
      transform: translateY(20px);
      max-width: 880px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="line-wrap">
      <div id="current-line">{{LINE}}</div>
      <div id="highlight-bar"></div>
      <div id="next-line">{{NEXT_LINE}}</div>
    </div>
  </div>

  <script>
    document.body.style.background = 'transparent';

    const DURATION = 4.0;

    const tl = gsap.timeline({ paused: true });

    // Phase 1 (0–0.5s): current line fades in + slides up
    tl.to('#current-line', {
      opacity: 1,
      y: 0,
      scale: 1,
      duration: 0.5,
      ease: 'power3.out',
    }, 0)

    // Phase 2 (0.4–0.9s): highlight bar sweeps in beneath current line
    .to('#highlight-bar', {
      width: 320,
      duration: 0.5,
      ease: 'power2.out',
    }, 0.4)

    // Phase 3 (0.7–1.1s): next line fades in dimly below
    .to('#next-line', {
      opacity: 1,
      y: 0,
      duration: 0.4,
      ease: 'power2.out',
    }, 0.7)

    // Phase 4 (2.8–3.2s): highlight bar fades out (line ending)
    .to('#highlight-bar', {
      opacity: 0,
      duration: 0.4,
      ease: 'power2.in',
    }, 2.8)

    // Phase 5 (3.2–3.6s): current line fades out + slides up slightly
    .to('#current-line', {
      opacity: 0,
      y: -24,
      duration: 0.4,
      ease: 'power2.in',
    }, 3.2)

    // Phase 6 (3.3–3.7s): next line fades out
    .to('#next-line', {
      opacity: 0,
      duration: 0.4,
      ease: 'power2.in',
    }, 3.3);

    window.__hf = {
      duration: DURATION,
      seek(t) { tl.seek(t); }
    };
  </script>
</body>
</html>
