name: action-extreme
version: 1.0.0
adapter_type: narrative_script
extends: _base

description: >
  Extreme action set-piece. High-octane third-person action with dramatic
  rim lighting, kinetic camera, energetic colour grade. Optimised for
  parkour, stunt, fight choreography narrative excerpts.

