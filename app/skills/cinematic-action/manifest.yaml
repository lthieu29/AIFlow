# skills/cinematic-action/manifest.yaml
# Cinematic Action skill — high-octane action film style for narrative/storyboard videos

name: cinematic-action
version: 1.0.0
adapter_type: narrative_script
extends: _base

description: >
  Cinematic action film style — dramatic lighting, dynamic camera movement,
  high-contrast visuals, explosive energy. Optimised for action sequences,
  thriller narratives, and high-stakes storytelling in 9:16 vertical format.

# Compatibility — narrative and storyboard adapters
supported_adapters:
  - narrative_script
  - storyboard_manual
  - script_direct

# Style
style_ref: style.json
prefix_file: prefix.md

# TTS voice — Vietnamese male for action narration
voice: vi-VN-NamMinhNeural

# Camera — dynamic for action (overrides _base static default)
camera_lock: false
safety_level: standard

options:
  default_aspect_ratio: "9:16"
  default_fps: 30
  default_camera: dynamic
