name: cinematic-drama
version: 1.0.0
adapter_type: narrative_script
extends: _base

description: >
  Cinematic prestige drama style. Naturalistic key light, muted earth-tone
  grade, intimate close-ups, slow deliberate camera. Optimised for
  dialogue-driven prestige narrative excerpts.

