name: cinematic-romance
version: 1.0.0
adapter_type: narrative_script
extends: _base

description: >
  Cinematic romance style. Golden-hour key, halation, soft side-light,
  bokeh-rich shallow depth of field, vintage warm grade. Optimised for
  novel-to-screen romantic excerpts.

supported_adapters:
  - narrative_script
  - storyboard_manual
  - script_direct
  - epub_novel

style_ref: style.json
prefix_file: prefix.md
voice: vi-VN-HoaiMyNeural

camera_lock: false
safety_level: standard

options:
  default_aspect_ratio: "16:9"
  default_fps: 24
  default_camera: dolly
  category: cinematic
