name: experimental-asmr
version: 1.0.0
adapter_type: narrative_script
extends: _base

description: >
  ASMR sensory experimental style. Macro extreme close-ups, isolated
  trigger sounds, intimate tactile aesthetic. Optimised for short
  ASMR-style narrative or podcast-caption clips.

supported_adapters:
  - narrative_script
  - script_direct
  - podcast_caption

style_ref: style.json
prefix_file: prefix.md
voice: vi-VN-HoaiMyNeural

camera_lock: true
safety_level: standard

options:
  default_aspect_ratio: "1:1"
  default_fps: 30
  default_camera: static
  category: experimental
