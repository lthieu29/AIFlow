name: nature-landscape
version: 1.0.0
adapter_type: narrative_script
extends: _base

description: >
  Sweeping nature landscape style. Drone wide shots, golden-hour
  documentary lighting, vivid earth-and-sky palette. Optimised for travel
  and nature narrative content.

supported_adapters:
  - narrative_script
  - script_direct
  - photo_slideshow
  - blog_article

style_ref: style.json
prefix_file: prefix.md
voice: vi-VN-HoaiMyNeural

camera_lock: false
safety_level: standard

options:
  default_aspect_ratio: "21:9"
  default_fps: 24
  default_camera: drone
  category: nature
