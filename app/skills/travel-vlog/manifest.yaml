name: travel-vlog
version: 1.0.0
adapter_type: narrative_script
extends: _base

description: >
  Travel vlog style. Naturalistic golden-hour photography, walking
  shots, market and skyline cutaways. Optimised for travel narrative
  excerpts and blog-to-video conversion.

supported_adapters:
  - narrative_script
  - blog_article
  - script_direct
  - photo_slideshow

style_ref: style.json
prefix_file: prefix.md
voice: vi-VN-HoaiMyNeural

camera_lock: false
safety_level: standard

options:
  default_aspect_ratio: "16:9"
  default_fps: 30
  default_camera: handheld
  category: lifestyle
